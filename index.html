<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek AI 学习学院 | DeepSeek AI Learning Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🤖 DeepSeek AI 学习学院</h1>
      <div class="subtitle">DeepSeek AI Learning Academy</div>
      <div class="author">Master Large Language Models | 掌握大语言模型技术</div>
    </header>

    <!-- 语言选择器 -->
    <div class="language-selector">
      <button class="lang-btn active" data-lang="auto" onclick="setLanguage('auto')">🌐 Auto</button>
      <button class="lang-btn" data-lang="zh" onclick="setLanguage('zh')">🇨🇳 中文</button>
      <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">🇺🇸 English</button>
    </div>

    <!-- 课程导航 -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="showLesson(1)">Lesson 1</button>
      <button class="tab-btn" onclick="showLesson(2)">Lesson 2</button>
      <button class="tab-btn" onclick="showLesson(3)">Lesson 3</button>
      <button class="tab-btn" onclick="showLesson(4)">Lesson 4</button>
      <button class="tab-btn" onclick="showLesson(5)">Lesson 5</button>
      <button class="tab-btn" onclick="showLesson(6)">Lesson 6</button>
      <button class="tab-btn" onclick="showLesson(7)">Lesson 7</button>
      <button class="tab-btn" onclick="showLesson(8)">Lesson 8</button>
    </div>

    <!-- 课程内容将由JavaScript动态加载 -->
    <div id="lesson-content"></div>

    <!-- AI助手按钮 -->
    <button class="ai-assistant-btn" onclick="toggleAI()">
      🤖<span class="pulse"></span>
    </button>

    <!-- AI助手面板 -->
    <div class="ai-panel" id="aiPanel">
      <div class="ai-header">
        <h3>AI Teaching Assistant</h3>
        <button class="close-btn" onclick="toggleAI()">×</button>
      </div>
      <div class="ai-response" id="aiResponse">
        <div style="color: var(--highlight); opacity: 0.7;">Ask me anything about DeepSeek...</div>
      </div>
      <div class="ai-input-container">
        <textarea id="userInput" placeholder="Type your question here..." rows="2"></textarea>
        <div class="ai-buttons">
          <button id="voiceBtn" onclick="toggleVoice()" class="voice-btn" title="Voice Input">🎤</button>
          <button onclick="sendMessage()" class="send-btn">📤 Send</button>
        </div>
        <button id="ttsBtn" onclick="speakResponse()" class="tts-btn" style="display:none;">🔊 Read Aloud</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
